<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f9fb" />
    <meta name="description" content="Tap & Read：给宝宝用中英文 Emoji 学习词汇。" />
    <title>Tap & Read · Emoji 词汇</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="data/emoji-data.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <main class="app-card">
        <section class="learn-panel" aria-label="Emoji 学习区">
          <header class="topbar">
            <div class="topbar-search" role="search">
              <div class="search-box">
                <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                  <circle cx="8.5" cy="8.5" r="5.5"></circle>
                  <path d="m13 13 4 4"></path>
                </svg>
                <input id="searchInput" type="text" autocomplete="off" spellcheck="false" inputmode="search" enterkeyhint="search" aria-label="搜索 Emoji" placeholder="搜索：猫猫、apple、水杯…" />
                <button class="clear-search" id="clearSearchButton" type="button" aria-label="清空搜索" hidden>×</button>
              </div>
            </div>
            <div class="topbar-actions">
              <button class="topbar-language-button" id="settingsButton" type="button" aria-label="设置学习语言" aria-expanded="false">
                <span id="topbarLanguageLabel" aria-hidden="true">中 / EN</span>
                <svg class="language-chevron" viewBox="0 0 12 12" aria-hidden="true" focusable="false">
                  <path d="m2.5 4.5 3.5 3 3.5-3"></path>
                </svg>
              </button>
            </div>
          </header>

          <div class="home-game-entry">
            <button class="start-game-button" id="startGameButton" type="button" disabled>🎯 找一找</button>
          </div>

          <div class="settings-backdrop" id="settingsBackdrop" hidden>
            <section class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
              <div class="settings-header">
                <div>
                  <p class="section-kicker">学习设置</p>
                  <h2 id="settingsTitle">选择学习语言</h2>
                </div>
                <button class="settings-close" id="settingsCloseButton" type="button" aria-label="关闭设置">×</button>
              </div>
              <p class="settings-subtitle">选择一种或两种语言，Emoji 会按你的选择显示和朗读。</p>
              <p class="settings-selected" id="activeLanguageSummary">中文 · English</p>
              <div class="language-picker" aria-label="选择要显示和朗读的语言">
                <button class="language-option is-active" type="button" data-language="zh" aria-pressed="true">
                  <span class="language-flag" aria-hidden="true">中</span>
                  <span class="language-copy">
                    <strong>中文</strong>
                    <small>普通话</small>
                  </span>
                  <span class="language-check" aria-hidden="true">✓</span>
                </button>
                <button class="language-option is-active" type="button" data-language="en" aria-pressed="true">
                  <span class="language-flag language-flag-en" aria-hidden="true">A</span>
                  <span class="language-copy">
                    <strong>English</strong>
                    <small>English</small>
                  </span>
                  <span class="language-check" aria-hidden="true">✓</span>
                </button>
              </div>
            </section>
          </div>

          <div class="hero-stage">
            <div class="hero-tap-area" id="heroTapArea" role="button" tabindex="0" aria-label="点击朗读当前 Emoji">
              <div class="hero-visual">
                <span class="hero-emoji" id="heroEmoji">🍎</span>
              </div>

              <div class="hero-copy" aria-live="polite">
                <div class="hero-wordings" id="heroWordings"></div>
                <p class="speech-note" id="speechNote">点这里听发音</p>
              </div>
            </div>

            <a class="hero-youtube-link" id="heroYoutubeLink" href="https://www.youtube.com/results?search_query=red%20apple" target="_blank" rel="noreferrer" aria-label="在 YouTube 搜索 red apple">
              <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <path d="M7.5 6.1 13.7 10l-6.2 3.9V6.1Z"></path>
              </svg>
            </a>
          </div>
        </section>

        <section class="explore-panel" aria-label="Emoji 浏览区">
          <div class="category-row" id="categoryRow" aria-label="Emoji 分类">
            <button class="category-chip is-active" type="button" data-category="all" aria-pressed="true">
              <span aria-hidden="true">✨</span> 全部
            </button>
            <button class="category-chip" type="button" data-category="people" aria-pressed="false">
              <span aria-hidden="true">🙂</span> 人和身体
            </button>
            <button class="category-chip" type="button" data-category="animals" aria-pressed="false">
              <span aria-hidden="true">🐻</span> 动物
            </button>
            <button class="category-chip" type="button" data-category="food" aria-pressed="false">
              <span aria-hidden="true">🍓</span> 食物
            </button>
            <button class="category-chip" type="button" data-category="travel" aria-pressed="false">
              <span aria-hidden="true">🚗</span> 出门
            </button>
            <button class="category-chip" type="button" data-category="activities" aria-pressed="false">
              <span aria-hidden="true">⚽</span> 玩一玩
            </button>
            <button class="category-chip" type="button" data-category="objects" aria-pressed="false">
              <span aria-hidden="true">🧸</span> 物品
            </button>
            <button class="category-chip" type="button" data-category="symbols" aria-pressed="false">
              <span aria-hidden="true">💡</span> 符号
            </button>
            <button class="category-chip" type="button" data-category="flags" aria-pressed="false">
              <span aria-hidden="true">🚩</span> 旗帜
            </button>
          </div>

          <div class="emoji-grid" id="emojiGrid" aria-busy="true">
            <div class="grid-loading" id="gridLoading">正在准备 Emoji…</div>
          </div>

          <footer class="data-credit">
            <span>本地学习数据 · 中英文名称和关键词</span>
            <a href="https://emojibase.dev/" target="_blank" rel="noreferrer">Emojibase</a>
          </footer>
        </section>

        <section class="game-panel" id="gamePanel" aria-labelledby="gameTitle" hidden>
          <header class="game-header">
            <button class="game-back-button" id="gameBackButton" type="button">← 返回</button>
            <div class="game-heading">
              <p class="section-kicker">听一听 · 找一找</p>
              <h1 id="gameTitle">找一找</h1>
            </div>
          </header>

          <div class="game-language-picker" id="gameLanguagePicker" role="radiogroup" aria-labelledby="gameLanguageCaption">
            <span class="game-language-caption" id="gameLanguageCaption">题目与语音</span>
            <div class="game-language-options">
              <input id="gameLanguageZh" type="radio" name="game-language" value="zh" checked />
              <label for="gameLanguageZh">中文</label>
              <input id="gameLanguageEn" type="radio" name="game-language" value="en" />
              <label for="gameLanguageEn">English</label>
            </div>
          </div>

          <div class="game-themes" id="gameThemes" aria-label="选择找一找主题">
            <button class="game-theme-button" type="button" data-game-theme="mixed" aria-pressed="true">混合</button>
            <button class="game-theme-button" type="button" data-game-theme="animals" aria-pressed="false">动物</button>
            <button class="game-theme-button" type="button" data-game-theme="food" aria-pressed="false">吃喝</button>
            <button class="game-theme-button" type="button" data-game-theme="everyday" aria-pressed="false">生活与玩具</button>
          </div>

          <div class="game-round">
            <div class="game-question" id="gameQuestion" aria-live="polite"></div>
            <button class="game-replay-button" id="gameReplayButton" type="button">🔊 再听一次</button>

            <div class="game-options" id="gameOptions" aria-label="选择答案"></div>

            <div class="game-feedback" id="gameFeedback" role="status" aria-live="polite" aria-atomic="true"></div>
            <p class="game-speech-note" id="gameSpeechNote" role="status" hidden></p>
          </div>
        </section>
      </main>
    </div>

    <noscript>
      <div class="noscript-message">请打开浏览器 JavaScript，才能使用搜索和朗读功能。</div>
    </noscript>
  </body>
</html>
